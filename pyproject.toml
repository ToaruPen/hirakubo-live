[project]
name = "hirakubo-live"
version = "0.1.0"
description = "Pixel art of Hirakubo-zaki lighthouse (Ishigaki Island): still, seamless loop and real-time web wallpaper"
requires-python = ">=3.13"
# exact pins: the build embeds float64 data and rasterised glyphs, so other numpy or Pillow
# (FreeType) versions may change the page's bytes
dependencies = ["numpy==2.5.3", "pillow==12.3.0"]

[dependency-groups]
dev = ["ruff==0.15.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "C4", "PIE", "PERF", "ERA"]
ignore = [
  # comments and docstrings use physics notation (×, −, σ) and Japanese names on purpose
  "RUF001",
  "RUF002",
  "RUF003",
]
